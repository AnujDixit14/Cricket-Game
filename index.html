<!doctype html>
<html lang="en">
  <head>
    <title>Cricket Game</title>
    <style>
      body {
        text-align: center;
        margin-top: 100px;
      }
      button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>
    <button
      onclick="
        let computerChoice = getComputerChoice();
        let resultMasg = result('Bat', computerChoice);

        ShowAlert('Bat', computerChoice, resultMasg);
      "
    >
      Bat
    </button>

    <button
      onclick="
        computerChoice = getComputerChoice();

        resultMasg = result('Bowl', computerChoice);

        ShowAlert('Bowl', computerChoice, resultMasg);
      "
    >
      Bowl
    </button>

    <button
      onclick="
        computerChoice = getComputerChoice();

        resultMasg = result('Stump', computerChoice);

        ShowAlert('Stump', computerChoice, resultMasg);
      "
    >
      Stump
    </button>

    <script>
      function getComputerChoice() {
        let randomNumber = Math.random() * 3;
        if (randomNumber < 1) {
          return "Bat";
        } else if (randomNumber < 2) {
          return "Bowl";
        } else if (randomNumber < 3) {
          return "Stump";
        }
      }

      function result(userMove, computerMove) {
        if (userMove === "Bat") {
          if (computerMove === "Bat") {
            return "its tie match";
          } else if (computerMove === "Bowl") {
            return "you won";
          } else {
            return "Computer Won";
          }
        } else if (userMove === "Bowl") {
          if (computerMove === "Bowl") {
            return "its tie match";
          } else if (computerMove === "Stump") {
            return "you won";
          } else {
            return "Computer Won";
          }
        } else if (userMove === "Stump") {
          if (computerMove === "Stump") {
            return "its tie match";
          } else if (computerMove === "Bat") {
            return "you won";
          } else {
            return "Computer Won";
          }
        }
      }

      function ShowAlert(userMove, computerChoice, resultMasg) {
        alert(
          `You choose ${userMove} and Computer Choice is ${computerChoice} and  ${resultMasg}`,
        );
      }
    </script>
  </body>
</html>
